<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Imagen para redes (1200×630). Regenerar: node og/og.cjs -->
<style>
@font-face{font-family:Nippo;font-weight:700;src:url(../public/fonts/Nippo-Bold.woff2) format('woff2')}
@font-face{font-family:Nippo;font-weight:500;src:url(../public/fonts/Nippo-Medium.woff2) format('woff2')}
:root{--dark:#07122B;--red:#E0281C;--blue:#4A7BFF;--bone:#F4F6FB;--gray:#9AA6C2}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:var(--dark);font-family:Nippo,sans-serif;color:var(--bone);position:relative}
.panel{position:absolute;inset:0 0 0 600px;background:var(--red);clip-path:polygon(26% 0,100% 0,100% 100%,0 100%)}
.num{position:absolute;right:-10px;top:50%;transform:translateY(-52%);font-weight:700;font-size:560px;line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:5px var(--blue)}
.player{position:absolute;right:40px;bottom:0;height:610px;filter:drop-shadow(-20px 18px 36px rgba(0,0,0,.5))}
.txt{position:absolute;left:64px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.tag{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.tag img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.tag b{font-size:22px;letter-spacing:.24em;text-transform:uppercase}
.tag span{font-size:20px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
h1{font-weight:700;text-transform:uppercase;line-height:.86}
h1 .n{display:block;font-size:66px}
h1 .s{display:block;font-size:74px;color:var(--red);margin-left:-.04em}
.club{margin-top:26px;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.domain{position:absolute;left:64px;bottom:44px;display:flex;align-items:center;gap:14px;font-weight:500;font-size:24px;letter-spacing:.06em}
.domain i{width:34px;height:3px;background:var(--red)}
</style></head><body>
<div class="panel"></div>
<div class="num">19</div>
<img class="player" src="../assets/polaco-junior.webp" alt="">
<div class="txt">
  <div class="tag"><img src="../assets/junior.webp" alt=""><b>Delantero</b></div>
  <h1><span class="n">Polaco</span><span class="s">Fydriszewski</span></h1>
</div>
<div class="domain">polacofydriszewski.com</div>
</body></html>
